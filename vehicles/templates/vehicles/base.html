{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Car Service{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vehicles/css/style.css' %}">
</head>
<body>
    <header>
        <div class="logo">🚗 Smart<span>Car</span>Service</div>
            <nav>
    <a href="{% url 'vehicle_list' %}">Vehicles</a>
    <a href="{% url 'technician_list' %}">Technicians</a>
    <a href="{% url 'maintenance_list' %}">Maintenance</a>
    <a href="{% url 'appointment_list' %}">Appointments</a>
    <a href="{% url 'chat_page' %}">💬 Assistant</a>
    {% if user.is_authenticated %}
        <span style="opacity:0.7; margin-left:10px;">👤 {{ user.username }}</span>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none; border:none; color:white; opacity:0.85; cursor:pointer; font-family:'Poppins',sans-serif; font-size:14px; padding:0;">Logout</button>
        </form>
    {% endif %}
</nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'vehicles/js/main.js' %}"></script>
</body>
</html>
